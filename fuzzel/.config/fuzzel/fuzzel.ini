# Fuzzel Configuration

[main]
font=FiraCode Nerd Font:weight=bold:size=12
dpi-aware=no
terminal=alacritty -e
#prompt="❯ "
icon-theme=Adwaita
width=35
horizontal-pad=20
vertical-pad=10
inner-pad=5
line-height=25
lines=10
letter-spacing=0
anchor=center
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=282a36dd
text=f8f8f2ff
match=8be9fdff
selection-match=8be9fdff
selection=44475add
selection-text=f8f8f2ff
border=bd93f9ff
# border=8be9fdff

[border]
width=2
radius=12

